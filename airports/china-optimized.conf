# china-optimized.conf — 国内优化机场预设
# 面向以国内直连为主、仅少量境外流量走代理的场景：
# 国内 DNS 走纯净公共 DNS，国外走 DoH/DoT。
# 注意：mihomo v1.19+ 已废弃 redir-host 模式，强制使用 fake-ip；
# 本预设保留 IPv6 off、国内 DNS 含 114 的差异，DNS 模式与其它预设一致。

AIRPORT_NAME="国内优化机场"
AIRPORT_SUBSCRIPTION_URL=""
AIRPORT_SUBSCRIPTION_UA="clash-verge/v2.4.0"
AIRPORT_IPV6="off"
AIRPORT_DNS_MODE="fakeip"
AIRPORT_KERNEL="mihomo"
AIRPORT_DOMESTIC_DNS="223.5.5.5;119.29.29.29;114.114.114.114"
AIRPORT_PROXY_DNS="https://1.1.1.1/dns-query;tls://8.8.8.8:853"
AIRPORT_RULES_EXTRA=""
AIRPORT_PROXY_GROUPS_EXTRA=""
AIRPORT_TUN="false"
AIRPORT_NOTES="国内优化：IPv6 关闭，国内 DNS 含 114；mihomo v1.19+ 不再支持 redir-host，已统一 fake-ip。"
