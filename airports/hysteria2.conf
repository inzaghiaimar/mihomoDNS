# hysteria2.conf — Hysteria2 / Hy2 机场预设
# Hysteria2 基于 UDP/QUIC，需要 mihomo 内核与支持 hy2 的 UA。
# 若节点服务端为 IPv6-only，请同时参考 ipv6-only.conf。

AIRPORT_NAME="Hysteria2 机场"
AIRPORT_SUBSCRIPTION_URL=""
# clash-verge UA 默认可触发订阅返回 hy2 节点
AIRPORT_SUBSCRIPTION_UA="clash-verge/v2.4.0"
AIRPORT_IPV6="auto"
AIRPORT_DNS_MODE="fakeip"
AIRPORT_KERNEL="mihomo"
AIRPORT_DOMESTIC_DNS="223.5.5.5;119.29.29.29"
AIRPORT_PROXY_DNS="https://1.1.1.1/dns-query;tls://8.8.8.8:853"
AIRPORT_RULES_EXTRA=""
AIRPORT_PROXY_GROUPS_EXTRA=""
AIRPORT_TUN="false"
AIRPORT_NOTES="Hysteria2：需 mihomo 内核；服务端 IPv6-only 时请改 AIRPORT_IPV6=on 并确保宿主机有 IPv6 路由 + UDP 放行。"
