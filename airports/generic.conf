# generic.conf — 通用机场预设
# 适用于大多数标准 Clash/Mihomo 订阅（vmess/vless/trojan/ss 等）。
# 使用通用 DNS 与 fakeip，IPv6 设为 auto（沿用订阅设置）。

AIRPORT_NAME="通用机场"
AIRPORT_SUBSCRIPTION_URL=""
AIRPORT_SUBSCRIPTION_UA="clash-verge/v2.4.0"
AIRPORT_IPV6="auto"
AIRPORT_DNS_MODE="fakeip"
AIRPORT_KERNEL="mihomo"
AIRPORT_DOMESTIC_DNS="223.5.5.5;119.29.29.29;2402:4e00::"
AIRPORT_PROXY_DNS="https://1.1.1.1/dns-query;tls://8.8.8.8:853"
AIRPORT_RULES_EXTRA=""
AIRPORT_PROXY_GROUPS_EXTRA=""
AIRPORT_TUN="false"
AIRPORT_NOTES="通用机场：标准协议订阅，fakeip 分流，IPv6 auto。"
